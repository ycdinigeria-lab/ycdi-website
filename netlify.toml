[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# GitHub OAuth handshake for the /admin login (Sveltia CMS), all on Netlify.
[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/auth"
  status = 200
[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200
