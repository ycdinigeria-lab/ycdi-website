backend:
  name: github
  repo: ycdinigeria-lab/ycdi-website
  branch: main
  # OAuth handshake endpoint. See the setup checklist.
  # Option A (all on Netlify): leave as your site origin; /auth and /callback are handled by Netlify Functions.
  # Option B (domain-independent): set this to your Sveltia CMS Auth worker URL.
# One shared media library. Nothing is uploaded twice.
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: blog
    label: "Blog & Gallery"
    label_singular: "Blog post"
    description: "Write a post, attach photos, and tick which photos should also appear in the main Gallery."
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "blog-{{slug}}.html"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Author", name: author, widget: string, default: "YCDI Team" }
      - { label: "Publication date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Category", name: category, widget: select, options: ["Discipleship","School Outreach","Leadership","Conferences","Scholarships","Community","General"], default: "General" }
      - { label: "Tags", name: tags, widget: list, required: false }
      - { label: "Excerpt (short summary for cards)", name: excerpt, widget: text }
      - { label: "Featured image", name: featuredImage, widget: image, required: false }
      - { label: "Featured image alt text", name: featuredImageAlt, widget: string, required: false }
      - { label: "Published", name: published, widget: boolean, default: true, hint: "Untick to keep this as a draft (it will not appear on the site)." }
      - label: "Photo gallery"
        name: gallery
        label_singular: "Photo"
        widget: list
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Photo", name: image, widget: image }
          - { label: "Caption", name: caption, widget: string, required: false }
          - { label: "Alt text (describes the photo)", name: alt, widget: string, required: false }
          - { label: "Show in main gallery", name: showInMainGallery, widget: boolean, default: false }
      - { label: "SEO title (optional)", name: seoTitle, widget: string, required: false }
      - { label: "SEO meta description (optional)", name: seoDescription, widget: text, required: false }
      - { label: "Body", name: body, widget: markdown }

  # ---- Chapters (add, edit or reorder; the homepage count and map of states update from this) ----
  - name: chapters
    label: "Chapters"
    label_singular: "Chapter"
    description: "Add a chapter here and it appears on the Chapters page. The homepage 'Chapters' and 'States' figures count themselves from this list."
    files:
      - name: chapters
        label: "All chapters"
        file: "src/_data/chapters.json"
        fields:
          - label: "Chapters"
            name: items
            widget: list
            label_singular: "Chapter"
            summary: "{{fields.name}}"
            fields:
              - { label: "Chapter name", name: name, widget: string, hint: "e.g. Benin, or Ilesa, Osun" }
              - { label: "State", name: state, widget: string, hint: "e.g. Edo State. This drives the 'States' number on the homepage." }
              - { label: "Country", name: country, widget: string, default: "Nigeria" }
              - { label: "Since (optional)", name: since, widget: string, required: false, hint: "e.g. Since 2017" }
              - { label: "Short headline", name: headline, widget: string }
              - { label: "Coordinator (optional)", name: coordinator, widget: string, required: false }
              - { label: "Volunteers (optional)", name: volunteers, widget: string, required: false }
              - { label: "Schools (optional)", name: schools, widget: string, required: false }
              - { label: "Photo (optional, shown on the homepage cards)", name: image, widget: image, required: false }
              - { label: "Story", name: story, widget: text, hint: "Leave a blank line between paragraphs." }

  # ---- Leadership (Board, National executive, Chapter coordinators), each with a photo ----
  - name: leadership
    label: "Leadership"
    description: "The people on the Leadership page. Upload a photo for each, or leave it empty to show a neutral placeholder."
    files:
      - name: leadership
        label: "Leadership team"
        file: "src/_data/leadership.json"
        fields:
          - label: "Board & international leadership"
            name: board
            widget: list
            label_singular: "Person"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Role", name: role, widget: string }
              - { label: "Photo", name: photo, widget: image, required: false }
              - { label: "Bio", name: bio, widget: text }
          - label: "National executive"
            name: national
            widget: list
            label_singular: "Person"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Role", name: role, widget: string }
              - { label: "Photo", name: photo, widget: image, required: false }
              - { label: "Bio", name: bio, widget: text }
          - label: "Chapter coordinators"
            name: coordinators
            widget: list
            label_singular: "Coordinator"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Location", name: location, widget: string, hint: "e.g. Benin, Edo State" }
              - { label: "Photo", name: photo, widget: image, required: false }

  # ---- Homepage testimonials ----
  - name: testimonials
    label: "Testimonials"
    description: "The quote cards under 'Real people. Real stories.' Only add a photo of a real person who gave the quote, with their permission."
    files:
      - name: testimonials
        label: "Homepage testimonials"
        file: "src/_data/testimonials.json"
        fields:
          - label: "Testimonials"
            name: items
            widget: list
            label_singular: "Testimonial"
            summary: "{{fields.name}}"
            fields:
              - { label: "Quote", name: quote, widget: text }
              - { label: "Name", name: name, widget: string }
              - { label: "Detail", name: detail, widget: string, required: false, hint: "e.g. YCDI Alumna, Idia College, Benin" }
              - { label: "Photo (optional)", name: photo, widget: image, required: false, hint: "Real person, with permission. Leave empty to show a neutral placeholder." }

  # ---- Homepage numbers that cannot be counted automatically ----
  - name: sitedata
    label: "Homepage numbers"
    description: "Chapters and States count themselves from the Chapters list. These two are set by hand."
    files:
      - name: stats
        label: "Homepage stat figures"
        file: "src/_data/stats.json"
        fields:
          - { label: "Young people reached", name: reached, widget: number, value_type: int, hint: "Shown with a + after it." }
          - { label: "Serving since (year)", name: since, widget: string }

  # ---- Programmes (the "What We Do" page sections) ----
  - name: programmes
    label: "Programmes"
    description: "The programme areas on the What We Do page. Add, edit or reorder them here."
    files:
      - name: programmes
        label: "What We Do sections"
        file: "src/_data/programmes.json"
        fields:
          - label: "Programmes"
            name: items
            widget: list
            label_singular: "Programme"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: body, widget: markdown, hint: "Links are fine, e.g. our safeguarding page." }

  # ---- Events (upcoming and past) ----
  - name: events
    label: "Events"
    description: "Public gatherings. An event moves from Upcoming to Past on its own once its date passes and the site rebuilds."
    files:
      - name: events
        label: "All events"
        file: "src/_data/events.json"
        fields:
          - label: "Events"
            name: items
            widget: list
            label_singular: "Event"
            summary: "{{fields.title}} ({{fields.dateLabel}})"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Used to sort and to decide upcoming vs past." }
              - { label: "Date shown on the page", name: dateLabel, widget: string, hint: "e.g. 25 September 2026, or October 2026 if the day is not fixed yet." }
              - { label: "Location", name: location, widget: string, required: false }
              - { label: "Summary", name: summary, widget: text }
              - { label: "Photo (optional)", name: image, widget: image, required: false }
              - { label: "Small note (optional)", name: note, widget: string, required: false, hint: "e.g. Details to be confirmed." }
